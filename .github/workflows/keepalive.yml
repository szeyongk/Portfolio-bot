name: Keepalive
on:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.email "keepalive@bot.com"
          git config user.name "Keepalive Bot"
          echo "keepalive $(date)" > keepalive.txt
          git add keepalive.txt
          git commit -m "keepalive"
          git push
